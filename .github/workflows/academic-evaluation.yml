name: Academic Evaluation - Semana 08 CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.6"
          cache: npm

      - name: AC-01 - Instalación limpia y reproducible
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium

      - name: AC-01 / AC-02 / AC-03 - Verificación técnica, pruebas y reportes
        shell: bash
        run: |
          set -euo pipefail
          npm run verify

      - name: AC-03 - Publicar reportes de pruebas y cobertura como artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academic-evaluation-reports
          if-no-files-found: warn
          path: |
            coverage/
            test-results/
            reports/verification.json
            playwright-report/